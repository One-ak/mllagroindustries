<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Official Vansh Group social hub for MLL Agro Industries, New Vanshika Bio Agro, Vansh Feeds and Fish Gold Industries." />
    <link rel="canonical" href="https://mllagroindustries.com/social/" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>Vansh Group Social Hub | MLL Agro Industries</title>
    <script src="./social-hub-enhancements.js"></script>
    <script type="module" crossorigin src="./assets/index-B-bGaZVP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-aF_oN26G.css">
    <style>
      .social-back-button {
        position: fixed;
        top: max(18px, env(safe-area-inset-top));
        left: clamp(14px, 3vw, 30px);
        z-index: 1200;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 999px;
        color: #334155;
        background: rgba(236, 243, 249, 0.92);
        box-shadow: 8px 8px 18px rgba(203, 214, 226, 0.85),
          -8px -8px 18px rgba(255, 255, 255, 0.95);
        font: 700 15px/1 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-decoration: none;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .social-back-button:hover {
        transform: translateY(-2px);
        box-shadow: 10px 10px 22px rgba(203, 214, 226, 0.9),
          -10px -10px 22px rgba(255, 255, 255, 1);
      }

      .social-back-button__icon {
        font-size: 20px;
        line-height: 1;
      }

      .social-skip-link {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: 50%;
        z-index: 1300;
        min-height: 44px;
        padding: 11px 18px;
        border-radius: 18px;
        color: #334155;
        background: #ffffff;
        box-shadow: 6px 6px 14px rgba(203, 214, 226, 0.85);
        font: 700 15px/1.4 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-decoration: none;
        transform: translate(-50%, -180%);
        transition: transform 0.2s ease;
      }

      .social-skip-link:focus,
      .social-skip-link:focus-visible {
        transform: translate(-50%, 0);
      }

      .social-back-button:focus-visible,
      .social-skip-link:focus-visible,
      #root :where(a, button, [role="button"], video):focus-visible {
        outline: 3px solid #075985;
        outline-offset: 4px;
      }

      #root .qr-container[role="button"] {
        cursor: pointer;
      }

      @media (max-width: 640px) {
        #root .app-container {
          padding-top: calc(68px + env(safe-area-inset-top)) !important;
        }

        .social-back-button {
          top: max(12px, env(safe-area-inset-top));
          left: max(12px, env(safe-area-inset-left));
          min-height: 44px;
          padding: 9px 14px;
          font-size: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto !important;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-delay: 0s !important;
          transition-duration: 0.01ms !important;
        }

        #root .bg-3d-element,
        #root .skeleton {
          animation: none !important;
        }

        #root .bg-3d-element {
          position: absolute;
        }

        .social-back-button:hover,
        #root .clay-btn:hover,
        #root .company-card:hover,
        #root .hero-product-video:hover,
        #root .post-link-item:hover,
        #root .poster-product-card:hover {
          transform: none !important;
        }
      }

      @media (forced-colors: active) {
        .social-back-button,
        .social-skip-link,
        #root .clay-btn,
        #root .company-card,
        #root .post-link-item {
          border: 1px solid ButtonText;
        }
      }
    </style>
  </head>
  <body>
    <a class="social-skip-link" href="#main-content">Skip to main content</a>
    <a class="social-back-button" href="../" aria-label="Back to MLL Agro Industries website">
      <span class="social-back-button__icon" aria-hidden="true">&larr;</span>
      <span>Back</span>
    </a>
    <div id="root"></div>
  </body>
</html>
